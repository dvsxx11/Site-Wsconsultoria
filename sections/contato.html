<section id="contato" class="section">
  <div class="container">
    <div class="contact">
      <div class="contact__info">
        <h2>Vamos conversar?</h2>
        <p>
          Preencha o formulário ou entre em contato pelos canais em baixo.
          Responderemos rapidamente.
        </p>
        <ul class="contact__list">
          <li><i class="bi bi-telephone"></i> (86) 99997-2659</li>
          <li><i class="bi bi-envelope"></i> wsassesoriacomercial@gmail.com</li>
          <li>
            <i class="bi bi-geo-alt"></i> Av. Piauí, 700 – Cocais Shopping, Loja
            59
          </li>
        </ul>
        <div class="contact__buttons">
          <a
            href="https://wa.me/5586999972659"
            target="_blank"
            rel="noopener"
            class="btn btn--whatsapp"
            ><i class="bi bi-whatsapp"></i> WhatsApp</a
          >
          <a
            href="https://www.instagram.com/wsassessoriacomercial"
            target="_blank"
            rel="noopener"
            class="btn btn--instagram"
            ><i class="bi bi-instagram"></i> Instagram</a
          >
        </div>
        <iframe
          src="https://www.google.com/maps?q=Av.%20Piauí,%20700%20Timon%20MA&output=embed"
          loading="lazy"
        ></iframe>
      </div>
      <form
        class="contact__form"
        action="https://formsubmit.co/wsassessoriacomercial@gmail.com"
        method="POST"
      >
        <input type="hidden" name="_subject" value="Novo contato do site!" />
        <input type="hidden" name="_captcha" value="false" />
        <label
          >Nome <input type="text" name="nome" placeholder="Seu nome" required
        /></label>
        <label
          >E-mail
          <input
            type="email"
            name="email"
            placeholder="voce@email.com"
            required
        /></label>
        <label
          >Mensagem
          <textarea
            name="mensagem"
            placeholder="Como podemos ajudar?"
            required
          ></textarea>
        </label>
        <button type="submit" class="btn btn--primary btn--block">
          Enviar mensagem
        </button>
      </form>
    </div>
  </div>
</section>
